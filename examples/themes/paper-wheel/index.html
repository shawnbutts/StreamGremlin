<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Paper wheel</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="wheel.js"></script>
  </head>
  <body>
    <main id="stage" hidden>
      <h1 id="title"></h1>
      <div class="wheel">
        <svg id="rotor" viewBox="-110 -110 220 220" aria-hidden="true"></svg>
        <div class="pointer"></div>
      </div>
      <ol id="chances"></ol>
      <p id="result"></p>
    </main>
  </body>
</html>
