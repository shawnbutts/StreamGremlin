version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
  settings:
    errcheck:
      exclude-functions:
        # Writing to the terminal and closing in defers: nothing useful to do on failure.
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Closer).Close
        - (*database/sql.Rows).Close
        - (*database/sql.DB).Close
        - (net.Listener).Close
        - (*os.File).Close
    gosec:
      excludes:
        # Every path is inside the data folder the streamer chose, never from the network.
        - G304
  exclusions:
    rules:
      # Tests use fake credentials, loosen file modes and copy files on
      # purpose, to check that the code refuses or contains them.
      - path: _test\.go
        linters: [gosec]
        text: "G101|G302|G703"
formatters:
  enable:
    - gofmt
    - goimports
