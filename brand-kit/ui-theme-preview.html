
<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StreamGremlin UI Theme Preview</title>
  <link rel="stylesheet" href="streamgremlin.css">
  <style>
    * { box-sizing: border-box; }

    body { margin: 0; }

    .wrap {
      max-width: 1100px;
      margin: auto;
      padding: 32px;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    select {
      font: inherit;
      padding: 10px;
      background: var(--sg-surface-raised);
      color: var(--sg-foreground);
      border: 1px solid var(--sg-border);
      border-radius: 8px;
    }

    .layout {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 20px;
      margin-top: 30px;
    }

    .nav, .panel { padding: 18px; }

    .nav div {
      padding: 10px;
      border-radius: 7px;
    }

    .nav .active {
      background: var(--sg-primary);
      color: var(--sg-primary-text);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .value {
      font-size: 2rem;
      font-weight: 750;
    }

    .bottom { margin-top: 22px; }

    .chip {
      display: inline-flex;
      padding: 6px 10px;
      border-radius: 99px;
      background: var(--sg-surface-raised);
      border: 1px solid var(--sg-border);
    }

    @media (max-width: 650px) {
      .layout { grid-template-columns: 1fr; }
      .cards { grid-template-columns: 1fr; }
      .nav { display: none; }
    }
  </style>
</head>

<body class="sg-app">
  <div class="wrap">
    <div class="top">
      <h1>StreamGremlin</h1>

      <label>
        Preview theme
        <select id="theme">
          <option value="dark">Dark Workshop</option>
          <option value="light">Light Workshop</option>
          <option value="midnight">Midnight Blue</option>
        </select>
      </label>
    </div>

    <div class="layout">
      <aside class="sg-panel nav">
        <div class="active">Dashboard</div>
        <div>Automations</div>
        <div>Triggers</div>
        <div>Integrations</div>
        <div>Logs</div>
        <div>Settings</div>
      </aside>

      <main>
        <section class="sg-panel panel">
          <h1>Dashboard</h1>
          <p class="sg-muted">
            Your little gremlin has everything under control.
          </p>

          <div class="cards">
            <div class="sg-panel panel">
              <div class="sg-muted">Status</div>
              <div class="value">● Live</div>
            </div>
            <div class="sg-panel panel">
              <div class="sg-muted">Workflows</div>
              <div class="value">24</div>
            </div>
            <div class="sg-panel panel">
              <div class="sg-muted">Events today</div>
              <div class="value">1,284</div>
            </div>
          </div>

          <div class="bottom">
            <h2>Quick action</h2>
            <p class="sg-muted">
              Example form and controls showing focus and hover states.
            </p>

            <input
              class="sg-input"
              aria-label="Workflow name"
              placeholder="Workflow name"
            >

            <button class="sg-button">Create workflow</button>

            <p><span class="chip">● Connected</span></p>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script>
    const selector = document.getElementById('theme');

    selector.addEventListener('change', () => {
      document.documentElement.dataset.theme = selector.value;
    });
  </script>
</body>
</html>
